<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — ExpenseTracker</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <canvas id="ambient-bg"></canvas>
  <div id="page-transition"></div>

  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-logo">
        <h1>💰 ExpenseTracker</h1>
        <p>Welcome back! Sign in to your account.</p>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
          <div class="form-error" id="email-error"></div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Minimum 8 characters" required>
          <div class="form-error" id="password-error"></div>
        </div>
        <div class="form-group">
          <div class="form-error" id="login-error"></div>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;">Sign In</button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="signup.html">Create one</a>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/animations.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Animations.initAmbientBackground();
      Animations.initMicroInteractions();
      Animations.initPageTransition();

      // Redirect if already logged in
      if (App.Auth.isLoggedIn()) {
        window.location.href = 'dashboard.html';
        return;
      }

      const form = document.getElementById('login-form');
      form.addEventListener('submit', (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        // Clear errors
        document.getElementById('email-error').textContent = '';
        document.getElementById('password-error').textContent = '';
        document.getElementById('login-error').textContent = '';

        let valid = true;

        if (!App.Auth.validEmail(email)) {
          document.getElementById('email-error').textContent = 'Enter a valid email address.';
          valid = false;
        }

        if (password.length < 8) {
          document.getElementById('password-error').textContent = 'Password must be at least 8 characters.';
          valid = false;
        }

        if (!valid) return;

        const result = App.Auth.login(email, password);
        if (result.ok) {
          window.location.href = 'dashboard.html';
        } else {
          document.getElementById('login-error').textContent = result.msg;
        }
      });
    });
  </script>
</body>
</html>
