<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — ExpenseTracker</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <canvas id="ambient-bg"></canvas>
  <div id="page-transition"></div>

  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-logo">
        <h1>💰 ExpenseTracker</h1>
        <p>Create your free account to start tracking.</p>
      </div>

      <form id="signup-form" novalidate>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="John Doe" required>
          <div class="form-error" id="name-error"></div>
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
          <div class="form-error" id="email-error"></div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Minimum 8 characters" required>
          <div class="form-error" id="password-error"></div>
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" class="form-control" placeholder="Re-enter password" required>
          <div class="form-error" id="confirm-error"></div>
        </div>
        <div class="form-group">
          <div class="form-error" id="signup-error"></div>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;">Create Account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/animations.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Animations.initAmbientBackground();
      Animations.initMicroInteractions();
      Animations.initPageTransition();

      if (App.Auth.isLoggedIn()) {
        window.location.href = 'dashboard.html';
        return;
      }

      const form = document.getElementById('signup-form');
      form.addEventListener('submit', (e) => {
        e.preventDefault();

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm-password').value;

        // Clear errors
        ['name-error', 'email-error', 'password-error', 'confirm-error', 'signup-error'].forEach(id => {
          document.getElementById(id).textContent = '';
        });

        let valid = true;

        if (!name) {
          document.getElementById('name-error').textContent = 'Name is required.';
          valid = false;
        }

        if (!App.Auth.validEmail(email)) {
          document.getElementById('email-error').textContent = 'Enter a valid email address.';
          valid = false;
        }

        if (password.length < 8) {
          document.getElementById('password-error').textContent = 'Password must be at least 8 characters.';
          valid = false;
        }

        if (password !== confirm) {
          document.getElementById('confirm-error').textContent = 'Passwords do not match.';
          valid = false;
        }

        if (!valid) return;

        const result = App.Auth.signup(name, email, password);
        if (result.ok) {
          window.location.href = 'dashboard.html';
        } else {
          document.getElementById('signup-error').textContent = result.msg;
        }
      });
    });
  </script>
</body>
</html>
